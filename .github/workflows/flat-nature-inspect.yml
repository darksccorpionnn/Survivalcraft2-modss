name: Flat Nature API inspection

on:
  push:
    branches: [ flat-nature-api-inspection ]
    paths:
      - "ApiInspector/**"
      - ".github/workflows/flat-nature-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ApiInspector/ApiInspector.csproj --configfile nuget.config
      - name: Build inspector
        run: dotnet build ApiInspector/ApiInspector.csproj -c Release --no-restore
      - name: Run inspector
        run: dotnet run --project ApiInspector/ApiInspector.csproj -c Release --no-build
      - name: Upload world-generation API report
        uses: actions/upload-artifact@v4
        with:
          name: Flat-Nature-World-API
          path: ApiInspector/bin/Release/net10.0/api-inspection.txt
          if-no-files-found: error
          retention-days: 7
