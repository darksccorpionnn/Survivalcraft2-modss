name: Natural Villages V0.7 - Full CSharp build
on:
  push:
    branches: [natural-villages-v0.7-full-build]
    paths:
      - 'NaturalVillagesBuildProbe/v07-source.tar.xz.b64'
      - '.github/workflows/natural-villages-v07-full.yml'
  workflow_dispatch:

jobs:
  full-source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract all eight existing mod source files
        run: |
          base64 -d NaturalVillagesBuildProbe/v07-source.tar.xz.b64 | tar -xJf -
          test "$(find NaturalVillages-Medieval-V0.7/Source -name '*.cs' | wc -l)" -eq 8
      - name: Restore game SDK references
        working-directory: NaturalVillages-Medieval-V0.7
        run: dotnet restore NaturalVillagesMedieval.csproj --configfile nuget.config
      - name: Compile actual village generator
        working-directory: NaturalVillages-Medieval-V0.7
        run: dotnet build NaturalVillagesMedieval.csproj --configuration Release --no-restore
      - name: Package compiled DLL and metadata into scmod
        working-directory: NaturalVillages-Medieval-V0.7
        run: |
          test -s bin/Release/net10.0/NaturalVillagesMedieval.dll
          python3 package_mod.py
          python3 - <<'PY'
          import zipfile
          p='NaturalVillages-Medieval-V0.7.scmod'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert set(z.namelist()) == {'modinfo.json','NaturalVillagesMedieval.dll'}
            assert len(z.read('NaturalVillagesMedieval.dll')) > 1024
          PY
      - name: Upload experimental scmod
        uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.7-EXPERIMENTAL
          path: NaturalVillages-Medieval-V0.7/NaturalVillages-Medieval-V0.7.scmod
          if-no-files-found: error
