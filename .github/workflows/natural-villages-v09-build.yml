name: Natural Villages v0.9 - Forest cottages, door and glass
on:
  push:
    branches: [natural-villages-v0.9-houses]
    paths:
      - 'NaturalVillagesV09/**'
      - '.github/workflows/natural-villages-v09-build.yml'
  workflow_dispatch:
jobs:
  compile-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore verified SCAPI 1.9.5.1 mod source
        run: |
          base64 -d NaturalVillagesBuildProbe/v07-source.tar.xz.b64 | tar -xJf -
          mv NaturalVillages-Medieval-V0.7 NaturalVillages-Medieval-V0.8
          python3 NaturalVillagesBuildProbe/v08-stability-patch.py NaturalVillages-Medieval-V0.8
          mv NaturalVillages-Medieval-V0.8 NaturalVillages-Medieval-V0.9
      - name: Apply V0.9 generation improvements
        run: |
          cp NaturalVillagesV09/Source/*.cs NaturalVillages-Medieval-V0.9/Source/
          mkdir -p NaturalVillages-Medieval-V0.9/LegacyTests
          mv NaturalVillages-Medieval-V0.9/Tests/test_*.py NaturalVillages-Medieval-V0.9/LegacyTests/
          cp NaturalVillagesV09/Tests/test_v09.py NaturalVillages-Medieval-V0.9/Tests/
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('NaturalVillages-Medieval-V0.9')
          info=root/'modinfo.json'
          m=json.loads(info.read_text());m['Version']='0.9.0'
          m['Description']='EXPERIMENTAL V0.9: real wooden door, framed glass, alternative terrain sites, vegetation-cleared cottages and roads. Android gameplay still unverified.'
          info.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          pack=root/'package_mod.py'
          pack.write_text(pack.read_text().replace('V0.8.scmod','V0.9.scmod'))
          loader=root/'Source'/'NaturalVillagesLoader.cs'
          loader.write_text(loader.read_text().replace('V0.8','V0.9'))
          (root/'README.md').write_text('''# Natural Villages Medieval Edition V0.9
          
          EXPERIMENTAL. New test worlds only! Replace/disable v0.8; do not use both at once.
          Real WoodenDoorBlock and FramedGlassBlock; forest-aware 7x9 cottages with alternate
          positions and up to 8 blocks of stone foundations; well and road vegetation clearing.
          
          Deterministic candidate villages nominally 400 blocks apart (selected 300-500).
          6-12 slots are PLANNED, not guaranteed placed. Hills and water may still reject sites.
          Hillside paths can remain too steep to walk; stair/terrain-aware routing is future work.
          Previously generated chunks will NOT be rebuilt by installing this update.
          
          Android in-game generation and door interaction require device testing. Runtime warnings
          may be shown for dependent library security advisories; review before wider distribution.
          Build and package: dotnet restore --configfile nuget.config && dotnet build -c Release && python package_mod.py
          Tests: python -m unittest discover -s Tests -p test_v09.py -q
          ''')
          PY
      - name: Run fifteen V0.9 source-safety checks
        working-directory: NaturalVillages-Medieval-V0.9
        run: python -m unittest discover -s Tests -p 'test_v09.py' -q
      - name: Restore .NET 10 game references
        working-directory: NaturalVillages-Medieval-V0.9
        run: dotnet restore NaturalVillagesMedieval.csproj --configfile nuget.config
      - name: Compile real eight-plus source files
        working-directory: NaturalVillages-Medieval-V0.9
        run: dotnet build NaturalVillagesMedieval.csproj --configuration Release --no-restore
      - name: Package and verify .scmod
        working-directory: NaturalVillages-Medieval-V0.9
        run: |
          test -s bin/Release/net10.0/NaturalVillagesMedieval.dll
          python package_mod.py
          python - <<'PY'
          import zipfile,json
          p='NaturalVillages-Medieval-V0.9.scmod'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert set(z.namelist()) == {'modinfo.json','NaturalVillagesMedieval.dll'}
            assert json.loads(z.read('modinfo.json'))['Version']=='0.9.0'
            assert len(z.read('NaturalVillagesMedieval.dll'))>1024
          print('V0.9 mod archive verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.9-EXPERIMENTAL
          path: NaturalVillages-Medieval-V0.9/NaturalVillages-Medieval-V0.9.scmod
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.9-SOURCE
          path: |
            NaturalVillages-Medieval-V0.9/Source/**
            NaturalVillages-Medieval-V0.9/Tests/**
            NaturalVillages-Medieval-V0.9/LegacyTests/**
            NaturalVillages-Medieval-V0.9/NaturalVillagesMedieval.csproj
            NaturalVillages-Medieval-V0.9/modinfo.json
            NaturalVillages-Medieval-V0.9/nuget.config
            NaturalVillages-Medieval-V0.9/package_mod.py
            NaturalVillages-Medieval-V0.9/README.md
          if-no-files-found: error
