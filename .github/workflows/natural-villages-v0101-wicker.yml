name: Natural Villages V0.10.1 - Wicker Lamp Build
on:
  push:
    branches: [natural-villages-v0.10.1-wicker-lamps]
    paths:
      - 'NaturalVillagesBuildProbe/v0101-wicker-patch.py'
      - '.github/workflows/natural-villages-v0101-wicker.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch verified V0.10 source
        uses: actions/download-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.10-SOURCE
          run-id: 45116442250
          github-token: ${{ github.token }}
          path: NaturalVillages-Medieval-V0.10.1
      - name: Apply Wicker Lamp source changes
        run: python NaturalVillagesBuildProbe/v0101-wicker-patch.py
      - name: Restore SCAPI 1.9.5.1
        working-directory: NaturalVillages-Medieval-V0.10.1
        run: dotnet restore NaturalVillagesMedieval.csproj --configfile nuget.config
      - name: Compile actual mod DLL
        working-directory: NaturalVillages-Medieval-V0.10.1
        run: dotnet build NaturalVillagesMedieval.csproj -c Release --no-restore
      - name: Package and test scmod
        working-directory: NaturalVillages-Medieval-V0.10.1
        run: |
          test -s bin/Release/net10.0/NaturalVillagesMedieval.dll
          python package_mod.py
          python - <<'PY'
          import json
          from zipfile import ZipFile
          p="NaturalVillages-Medieval-V0.10.1.scmod"
          with ZipFile(p) as z:
            assert z.testzip() is None
            assert set(z.namelist()) == {"modinfo.json","NaturalVillagesMedieval.dll"}
            assert json.loads(z.read("modinfo.json"))["Version"]=="0.10.1"
            assert len(z.read("NaturalVillagesMedieval.dll"))>1024
          print("NaturalVillages V0.10.1 package PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.10.1-EXPERIMENTAL
          path: NaturalVillages-Medieval-V0.10.1/NaturalVillages-Medieval-V0.10.1.scmod
          if-no-files-found: error
