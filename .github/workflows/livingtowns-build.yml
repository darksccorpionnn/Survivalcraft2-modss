name: Living Towns build

on:
  push:
    branches: [ livingtowns-0.4.0-dev ]
    paths:
      - 'LivingTowns/**'
      - '.github/workflows/livingtowns-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch Survivalcraft API source
        run: git clone --depth 1 --branch SCAPI1.9 https://github.com/GGigHub/SurvivalcraftApi.git api
      - name: Remove unavailable optional FLAC decoder for compile-only API reference
        run: |
          sed -i '/NAudio.Flac.Unknown.Mod/d' api/Engine/Engine.props api/Survivalcraft/Survivalcraft.props
          cat > api/Engine/Engine.Media/Flac.cs <<'CS'
          using System;
          using System.IO;
          namespace Engine.Media
          {
              public static class Flac
              {
                  public static bool IsFlacStream(Stream stream) => false;
                  public static StreamingSource Stream(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
                  public static SoundData Load(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
              }
          }
          CS
      - name: Restore
        run: dotnet restore LivingTowns/LivingTowns.csproj --configfile LivingTowns/nuget.org.config
      - name: Build
        run: dotnet build LivingTowns/LivingTowns.csproj --configuration Release --no-restore
      - name: Package complete .scmod
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          output_dir="LivingTowns/bin/Release/net10.0"
          cp "$output_dir/LivingTowns.dll" "$package_dir/"
          cp LivingTowns/modinfo.json "$package_dir/"
          test -d LivingTowns/Assets
          cp -a LivingTowns/Assets "$package_dir/Assets"
          test -s "$package_dir/Assets/Models/CelticBed/CelticBed.glb"
          test -s "$package_dir/Assets/Models/Farmer/Farmer.glb"
          test -s "$package_dir/Assets/Models/FemaleVillager/FemaleVillager.glb"
          test -s "$package_dir/Assets/Models/MaleVillager/MaleVillager.glb"
          test -s "$package_dir/Assets/LivingTownsDatabase.xdb"
          test -s "$package_dir/Assets/Animations/Farmer.json"
          test -s "$package_dir/Assets/Lang/tr-TR.json"
          (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/$output_dir/LivingTowns.scmod" LivingTowns.dll modinfo.json Assets)
          unzip -t "$output_dir/LivingTowns.scmod"
          echo "Packaged entry count:"
          unzip -Z1 "$output_dir/LivingTowns.scmod" | tee "$RUNNER_TEMP/package-files.txt" | wc -l
          grep -q '^Assets/Models/CelticBed/CelticBed.glb$' "$RUNNER_TEMP/package-files.txt"
          grep -q '^Assets/LivingTownsDatabase.xdb$' "$RUNNER_TEMP/package-files.txt"
          du -h "$output_dir/LivingTowns.scmod"
      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: LivingTowns-0.4.28-complete-scmod
          path: LivingTowns/bin/Release/net10.0/LivingTowns.scmod
          if-no-files-found: error
