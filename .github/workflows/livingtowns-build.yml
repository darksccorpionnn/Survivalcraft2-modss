name: Living Towns build

on:
  push:
    branches: [ livingtowns-0.4.0-dev, livingtowns-0.4.33-villager-ai, livingtowns-0.4.33-sleep-stability, livingtowns-0.4.44-development ]
    paths:
      - 'LivingTowns/**'
      - '.github/workflows/livingtowns-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python for deterministic coin assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 3D silver and gold coin models and textures
        run: |
          python -m pip install Pillow
          python LivingTowns/GenerateCurrencyAssets.py
      - name: Fetch Survivalcraft API source
        run: git clone --depth 1 --branch SCAPI1.9 https://github.com/GGigHub/SurvivalcraftApi.git api
      - name: Remove unavailable optional FLAC decoder for compile-only API reference
        run: |
          sed -i '/NAudio.Flac.Unknown.Mod/d' api/Engine/Engine.props api/Survivalcraft/Survivalcraft.props
          cat > api/Engine/Engine.Media/Flac.cs <<'CS'
          using System;
          using System.IO;
          namespace Engine.Media
          {
              public static class Flac
              {
                  public static bool IsFlacStream(Stream stream) => false;
                  public static StreamingSource Stream(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
                  public static SoundData Load(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
              }
          }
          CS
      - name: Restore
        run: dotnet restore LivingTowns/LivingTowns.csproj --configfile LivingTowns/nuget.org.config
      - name: Build
        run: dotnet build LivingTowns/LivingTowns.csproj --configuration Release --no-restore
      - name: Verify currency and inventory trading
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, xml.etree.ElementTree as ET
          from pathlib import Path
          output = Path("LivingTowns/bin/Release/net10.0")
          assert (output / "LivingTowns.dll").is_file()
          info = json.loads((output / "modinfo.json").read_text(encoding="utf-8"))
          assert info.get("Version") == "0.4.59"
          rows = list(csv.reader((output / "Assets/LivingTownsBlocksData.csv").open(encoding="utf-8-sig", newline=""), delimiter=";"))
          assert len(rows) == 3 and len(rows[0]) == 78 and all(len(row) == len(rows[0]) for row in rows)
          assert rows[1][0] == "SilverCoinBlock" and rows[2][0] == "GoldCoinBlock"
          for name in ("SilverCoin", "GoldCoin"):
              ET.parse(output / f"Assets/Models/LivingTownsCoins/{name}.dae")
              assert (output / f"Assets/Textures/LivingTownsCoins/{name}.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          source = Path("LivingTowns/Source")
          villager = (source / "ComponentLivingTownsVillager.cs").read_text(encoding="utf-8")
          widget = (source / "LivingTownsTradeWidget.cs").read_text(encoding="utf-8")
          inventory = (source / "LivingTownsTradeInventory.cs").read_text(encoding="utf-8")
          interaction = (source / "LivingTownsVillagerInteractionPatch.cs").read_text(encoding="utf-8")
          assert "m_tradeInventory = new LivingTownsTradeInventory(Project)" in villager
          assert "m_tradeInventory?.Save(valuesDictionary)" in villager
          assert "GetTradeInventory()" in villager
          assert "ShowJobMenu" not in villager and "GiveHeldItems" not in villager
          assert "InventorySlotWidget" in widget and "ModalPanelWidget" in widget
          assert "TradeInventory" in inventory and "TradeInventory" in villager
          assert "LivingTownsTradeWidget.TryOpen" in interaction
          assert "villager.ShowJobMenu" not in interaction
          print("Verified: DLL, 3D coin assets, currency item definitions, persistent independent trade stock, native inventory UI, tap interaction, and removal of the old menu.")
          PY
      - name: Upload currency and trade build components
        uses: actions/upload-artifact@v4
        with:
          name: LivingTowns-0.4.59-currency-trading
          path: |
            LivingTowns/bin/Release/net10.0/LivingTowns.dll
            LivingTowns/bin/Release/net10.0/modinfo.json
            LivingTowns/bin/Release/net10.0/Assets/LivingTownsBlocksData.csv
            LivingTowns/bin/Release/net10.0/Assets/LivingTowns-0.4.58-Currency-Notes.txt
            LivingTowns/bin/Release/net10.0/Assets/Lang/tr-TR.json
            LivingTowns/bin/Release/net10.0/Assets/Lang/en-US.json
            LivingTowns/bin/Release/net10.0/Assets/Models/LivingTownsCoins/*.dae
            LivingTowns/bin/Release/net10.0/Assets/Textures/LivingTownsCoins/*.png
          if-no-files-found: error
          retention-days: 14
