name: Living Towns build

on:
  push:
    branches: [ livingtowns-0.4.0-dev, livingtowns-0.4.33-villager-ai, livingtowns-0.4.33-sleep-stability ]
    paths:
      - 'LivingTowns/**'
      - '.github/workflows/livingtowns-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch Survivalcraft API source
        run: git clone --depth 1 --branch SCAPI1.9 https://github.com/GGigHub/SurvivalcraftApi.git api
      - name: Remove unavailable optional FLAC decoder for compile-only API reference
        run: |
          sed -i '/NAudio.Flac.Unknown.Mod/d' api/Engine/Engine.props api/Survivalcraft/Survivalcraft.props
          cat > api/Engine/Engine.Media/Flac.cs <<'CS'
          using System;
          using System.IO;
          namespace Engine.Media
          {
              public static class Flac
              {
                  public static bool IsFlacStream(Stream stream) => false;
                  public static StreamingSource Stream(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
                  public static SoundData Load(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
              }
          }
          CS
      - name: Restore
        run: dotnet restore LivingTowns/LivingTowns.csproj --configfile LivingTowns/nuget.org.config
      - name: Build
        run: dotnet build LivingTowns/LivingTowns.csproj --configuration Release --no-restore
      - name: Verify compiled assembly
        run: |
          set -euo pipefail
          test -s LivingTowns/bin/Release/net10.0/LivingTowns.dll
          grep -q '"Version": "0.4.43"' LivingTowns/modinfo.json
          echo "Compiled DLL:"
          ls -lh LivingTowns/bin/Release/net10.0/LivingTowns.dll
          mkdir -p package
          cp LivingTowns/bin/Release/net10.0/LivingTowns.dll package/
          cp LivingTowns/modinfo.json package/
          (cd package && zip -q ../LivingTowns-0.4.42.scmod LivingTowns.dll modinfo.json)
          test -s LivingTowns-0.4.42.scmod
          unzip -l LivingTowns-0.4.42.scmod
      - name: Upload compiled assembly
        uses: actions/upload-artifact@v4
        with:
          name: LivingTowns-0.4.43-package
          path: |
            LivingTowns/bin/Release/net10.0/LivingTowns.dll
            LivingTowns-0.4.42.scmod
          if-no-files-found: error
          retention-days: 14
