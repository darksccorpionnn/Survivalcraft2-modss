name: Living Towns build

on:
  push:
    branches: [ livingtowns-0.4.0-dev, livingtowns-0.4.33-villager-ai, livingtowns-0.4.33-sleep-stability, livingtowns-0.4.44-development, livingtowns-0.4.58-trading-ui, livingtowns-0.4.61-navigation-fix ]
    paths:
      - 'LivingTowns/**'
      - '.github/workflows/livingtowns-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch Survivalcraft API source
        run: git clone --depth 1 --branch SCAPI1.9 https://github.com/GGigHub/SurvivalcraftApi.git api
      - name: Remove unavailable optional FLAC decoder for compile-only API reference
        run: |
          sed -i '/NAudio.Flac.Unknown.Mod/d' api/Engine/Engine.props api/Survivalcraft/Survivalcraft.props
          cat > api/Engine/Engine.Media/Flac.cs <<'CS'
          using System;
          using System.IO;
          namespace Engine.Media
          {
              public static class Flac
              {
                  public static bool IsFlacStream(Stream stream) => false;
                  public static StreamingSource Stream(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
                  public static SoundData Load(Stream stream) => throw new NotSupportedException("FLAC decoder omitted from compile-only API reference.");
              }
          }
          CS
      - name: Restore
        run: dotnet restore LivingTowns/LivingTowns.csproj --configfile LivingTowns/nuget.org.config
      - name: Build
        run: dotnet build LivingTowns/LivingTowns.csproj --configuration Release --no-restore
      - name: Verify navigation regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("LivingTowns/Source/ComponentLivingTownsVillager.cs").read_text(encoding="utf-8")
          checks = {
              "null native destination keeps managed target": "Vector3 target = nativeTarget.HasValue ? nativeTarget.Value : m_managedDestination;" in source,
              "connected obstacle waypoint search": "bool[,,] visited" in source and "Cardinal links avoid diagonal corner-cutting" in source,
              "home door never falls back to unchecked ideal": "return found ? best : ideal;" not in source,
              "blocked bed does not teleport": "settled at its assigned bed after a blocked final approach" not in source,
              "blacksmith chooses a safe approach": "TryGetWorkApproach(m_workTarget.X, m_workTarget.Y + 1" in source,
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if not all(checks.values()):
              raise SystemExit("Navigation regression checks failed")
          PY
      - name: Verify compiled assembly
        run: |
          set -euo pipefail
          test -s LivingTowns/bin/Release/net10.0/LivingTowns.dll
          grep -q '"Version": "0.4.58"' LivingTowns/modinfo.json
          echo "Compiled DLL:"
          ls -lh LivingTowns/bin/Release/net10.0/LivingTowns.dll
      - name: Upload compiled assembly
        uses: actions/upload-artifact@v4
        with:
          name: LivingTowns-navigation-fix-assembly
          path: |
            LivingTowns/bin/Release/net10.0/LivingTowns.dll
          if-no-files-found: error
          retention-days: 14
