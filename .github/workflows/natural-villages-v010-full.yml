name: Natural Villages V0.10 - Real SCAPI build
on:
  push:
    branches: [natural-villages-v0.10-compact-lit]
    paths:
      - 'NaturalVillagesBuildProbe/v010-house.cs.xz.b64'
      - 'NaturalVillagesBuildProbe/v010-build-patch.py'
      - '.github/workflows/natural-villages-v010-full.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download last validated V0.9 source archive
        uses: actions/download-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.9-SOURCE
          run-id: 45113915206
          github-token: ${{ github.token }}
          path: NaturalVillages-Medieval-V0.10
      - name: Apply actual V0.10 CSharp cottage and village changes
        run: |
          test -s NaturalVillages-Medieval-V0.10/Source/MedievalHouseGenerator.cs
          base64 -d NaturalVillagesBuildProbe/v010-house.cs.xz.b64 | xz -d > NaturalVillages-Medieval-V0.10/Source/MedievalHouseGenerator.cs
          python NaturalVillagesBuildProbe/v010-build-patch.py NaturalVillages-Medieval-V0.10
          test "$(find NaturalVillages-Medieval-V0.10/Source -name '*.cs' | wc -l)" -eq 9
      - name: Restore SCAPI dependency
        working-directory: NaturalVillages-Medieval-V0.10
        run: dotnet restore NaturalVillagesMedieval.csproj --configfile nuget.config
      - name: Compile V0.10 mod with real SDK
        working-directory: NaturalVillages-Medieval-V0.10
        run: dotnet build NaturalVillagesMedieval.csproj -c Release --no-restore
      - name: Create and inspect scmod package
        working-directory: NaturalVillages-Medieval-V0.10
        run: |
          test -s bin/Release/net10.0/NaturalVillagesMedieval.dll
          python package_mod.py
          python - <<'PY'
          from zipfile import ZipFile
          import json
          fn='NaturalVillages-Medieval-V0.10.scmod'
          with ZipFile(fn) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'modinfo.json','NaturalVillagesMedieval.dll'}
              assert json.loads(z.read('modinfo.json'))['Version']=='0.10.0'
              assert len(z.read('NaturalVillagesMedieval.dll'))>1024
          print('V0.10 compiled mod archive verified')
          PY
      - name: Upload V0.10 experimental mod
        uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.10-EXPERIMENTAL
          path: NaturalVillages-Medieval-V0.10/NaturalVillages-Medieval-V0.10.scmod
          if-no-files-found: error
      - name: Upload V0.10 source for audit
        uses: actions/upload-artifact@v4
        with:
          name: NaturalVillages-Medieval-V0.10-SOURCE
          path: |
            NaturalVillages-Medieval-V0.10/Source/*.cs
            NaturalVillages-Medieval-V0.10/modinfo.json
            NaturalVillages-Medieval-V0.10/NaturalVillagesMedieval.csproj
            NaturalVillages-Medieval-V0.10/nuget.config
            NaturalVillages-Medieval-V0.10/package_mod.py
          if-no-files-found: error
