name: Living Towns Automated Checks

on:
  push:
    branches: [ main ]
    paths:
      - "LivingTownsSheepAddon/**"
      - "LivingTownsTestHarness/**"
      - "TownBootstrap/**"
      - "tests/**"
      - ".github/workflows/livingtowns-automated-tests.yml"
      - "nuget.config"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build sheep addon
        run: |
          dotnet restore LivingTownsSheepAddon/LivingTownsSheepAddon.csproj --configfile nuget.config
          dotnet build LivingTownsSheepAddon/LivingTownsSheepAddon.csproj --configuration Release --no-restore

      - name: Restore and build TownBootstrap package
        run: |
          dotnet restore TownBootstrap/TownBootstrap.csproj --configfile nuget.config
          dotnet build TownBootstrap/TownBootstrap.csproj --configuration Release --no-restore

      - name: Restore and build in-game test harness
        run: |
          dotnet restore LivingTownsTestHarness/LivingTownsTestHarness.csproj --configfile nuget.config
          dotnet build LivingTownsTestHarness/LivingTownsTestHarness.csproj --configuration Release --no-restore

      - name: Run static test suite
        run: python3 tests/run_static_tests.py

      - name: Upload test report and build outputs
        uses: actions/upload-artifact@v4
        with:
          name: LivingTowns-Automated-Test-Report
          path: |
            test-results/LivingTowns-TestReport.txt
            test-results/LivingTowns-TestReport.json
            LivingTownsSheepAddon/bin/Release/net10.0/LivingTownsSheepAddon.dll
            TownBootstrap/bin/Release/TownBootstrap.scmod
            LivingTownsTestHarness/bin/Release/LivingTownsTestHarness.scmod
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable test harness package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: livingtowns-test-harness-v0.2.0
          name: Living Towns Test Harness 0.2.0
          prerelease: true
          body: |
            Read-only Android in-game observer for real wolf-versus-bull combat.
            Checks actual health loss, counter-retaliation, 12% damage caps and the 2.5-second cooldown.
            Compatible with Survivalcraft 2.4.0.0 / API 1.9.5.1.
          files: LivingTownsTestHarness/bin/Release/LivingTownsTestHarness.scmod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
