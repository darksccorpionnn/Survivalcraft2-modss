name: Build Flat Nature SCMod

on:
  push:
    branches: [ flat-nature-api-scan, wood-stove-integration, blue-torch ]
    paths:
      - "FlatNature/**"
      - "README-FlatNature.md"
      - ".github/workflows/flat-nature-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FlatNature/FlatNature.csproj --configfile nuget.config
      - name: Build
        run: dotnet build FlatNature/FlatNature.csproj -c Release --no-restore
      - name: Generate iron kettle GLB
        run: |
          python -m pip install --disable-pip-version-check trimesh pillow numpy
          python FlatNature/tools/generate_iron_kettle.py
      - name: Package SCMod
        run: |
          mkdir -p package
          cp FlatNature/bin/Release/net10.0/FlatNature.dll package/
          cp FlatNature/modinfo.json package/
          if [ -d FlatNature/Assets ]; then cp -R FlatNature/Assets package/; fi
          (cd package && zip -9 -r ../FlatNature.scmod .)
          unzip -l FlatNature.scmod
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Flat-Nature-SCMod
          path: FlatNature.scmod
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flat-Nature-Build-Logs
          path: FlatNature/bin/Release/net10.0/
          if-no-files-found: ignore
          retention-days: 7
