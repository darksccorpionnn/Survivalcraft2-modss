name: Build Koyluler Mod

on:
  push:
    branches: [ main ]
    paths:
      - "KoylulerModu/**"
      - "nuget.config"
      - ".github/workflows/build-koyluler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore compressed database and prepare door-linked templates
        run: |
          base64 -d KoylulerModu/Assets/KoylulerDatabase.xdb.gz.b64 | gzip -d > KoylulerModu/Assets/KoylulerDatabase.xdb
          python3 KoylulerModu/prepare_koyluler_db.py KoylulerModu/Assets/KoylulerDatabase.xdb
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore KoylulerModu/KoylulerModu.csproj --configfile nuget.config
      - name: Build
        run: dotnet build KoylulerModu/KoylulerModu.csproj --configuration Release --no-restore
      - name: Verify villager identity, eggs, door spawning, and preserved sign/work/home routing
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('KoylulerModu')
          db = ET.parse(p / 'Assets/KoylulerDatabase.xdb').getroot()
          entities = db.findall('EntityTemplate')
          names = ['MaleVillager','FemaleVillager','Farmer','Blacksmith','Merchant','Healer','Guard','Hunter','Shepherd']
          primary = {f'KoylulerModu_{n}' for n in names}
          aliases = {f'LivingTowns_{n}' for n in names}
          expected = primary | aliases
          actual = {e.attrib.get('Name') for e in entities}
          if len(entities) != 18 or actual != expected:
              raise SystemExit(f'Unexpected templates; missing={expected-actual}, extra={actual-expected}, count={len(entities)}')
          identity_template = next((c for c in db.findall('ComponentTemplate') if c.attrib.get('Name') == 'KoylulerIdentity'), None)
          if identity_template is None:
              raise SystemExit('Missing ComponentTemplate/KoylulerIdentity')
          identity_class = {x.attrib.get('Name'):x.attrib.get('Value') for x in identity_template.findall('Parameter')}.get('Class')
          if identity_class != 'Game.ComponentKoyluIdentity':
              raise SystemExit(f'KoylulerIdentity Class is missing or invalid: {identity_class}')
          project = next((e for e in db if e.tag == 'ProjectTemplate' and e.attrib.get('Name') == 'Project'), None)
          if project is None or not any(s.attrib.get('Name') == 'LivingTownsDoorBehavior' for s in project.findall('MemberSubsystemTemplate')):
              raise SystemExit('Missing Project/LivingTownsDoorBehavior')
          egg_indices = []
          for e in entities:
              template_name = e.attrib['Name']
              components = {c.attrib.get('Name'): c for c in e.findall('MemberComponentTemplate')}
              required = {'HumanModel','Creature','Locomotion','LivingTownsVillagerController','KoylulerIdentity','WalkAroundBehavior','Body'}
              if not required.issubset(components):
                  raise SystemExit(f'{template_name} is missing required components: {required-set(components)}')
              for component_name, component in components.items():
                  optional = {x.attrib.get('Name'): x for x in component.findall('Parameter')}.get('IsOptional')
                  if optional is None or optional.attrib.get('Value') != 'False' or optional.attrib.get('Type') != 'bool':
                      raise SystemExit(f'{template_name}/{component_name} has no valid IsOptional=False parameter')
              identity_member = components['KoylulerIdentity']
              if identity_member.attrib.get('InheritanceParent') != identity_template.attrib.get('Guid'):
                  raise SystemExit(f'{template_name}/KoylulerIdentity is not linked to its Class template')
              walk_class = {x.attrib.get('Name'):x.attrib.get('Value') for x in components['WalkAroundBehavior'].findall('Parameter')}.get('Class')
              if walk_class != 'Game.ComponentNoEffect':
                  raise SystemExit(f'{template_name} has a competing WalkAroundBehavior: {walk_class}')
              locomotion = {x.attrib.get('Name'):x.attrib.get('Value') for x in components['Locomotion'].findall('Parameter')}
              for key, expected_value in {'WalkSpeed':'2.2','TurnSpeed':'8','AccelerationFactor':'1.5'}.items():
                  if locomotion.get(key) != expected_value:
                      raise SystemExit(f'{template_name} has wrong {key}: {locomotion.get(key)}')
              body = {x.attrib.get('Name'):x.attrib.get('Value') for x in components['Body'].findall('Parameter')}
              if body.get('MaxSmoothRiseHeight') != '0.5':
                  raise SystemExit(f'{template_name} has wrong MaxSmoothRiseHeight: {body.get("MaxSmoothRiseHeight")}')
              model = components['HumanModel']
              params = {x.attrib.get('Name'): x.attrib.get('Value') for x in model.findall('Parameter')}
              if not params.get('ModelName','').startswith('Models/') or not params.get('AnimationConfigPath','').startswith('Animations/'):
                  raise SystemExit(f'Invalid model/animation reference in {template_name}')
              eggs = [x for x in e.findall('ParameterSet') if x.attrib.get('Name') == 'CreatureEggData']
              if template_name in primary:
                  if len(eggs) != 1:
                      raise SystemExit(f'{template_name} must have one spawn egg')
                  egg_params = {x.attrib.get('Name'): x for x in eggs[0].findall('Parameter')}
                  expected_types = {'TextureSlot':'int', 'Color':'Color', 'EggTypeIndex':'int', 'DisplayName':'string', 'ShowEgg':'bool', 'SwapUV':'bool'}
                  for key, expected_type in expected_types.items():
                      if key not in egg_params or egg_params[key].attrib.get('Type') != expected_type:
                          raise SystemExit(f'{template_name} invalid egg parameter type for {key}')
                  if len(egg_params) != len(expected_types):
                      raise SystemExit(f'{template_name} has unexpected egg parameter count')
                  egg_indices.append(int(egg_params['EggTypeIndex'].attrib['Value']))
              elif eggs:
                  raise SystemExit(f'Door alias must not add a duplicate egg: {template_name}')
          if sorted(egg_indices) != list(range(700,709)):
              raise SystemExit(f'Unexpected egg indices: {egg_indices}')
          for lang in ('tr-TR','en-US'):
              data = json.loads((p / f'Assets/Lang/{lang}.json').read_text(encoding='utf-8'))
              for name in names:
                  if f'DisplayName:KoylulerModu_{name}Egg' not in data:
                      raise SystemExit(f'Missing localized egg name for {name} in {lang}')
          loader = (p / 'KoylulerModuModLoader.cs').read_text(encoding='utf-8')
          identity = (p / 'ComponentKoyluIdentity.cs').read_text(encoding='utf-8')
          ui_patch = (p / 'VillagerInventoryNamePatch.cs').read_text(encoding='utf-8')
          bridge = (p / 'VillagerInventoryNameBridge.cs').read_text(encoding='utf-8')
          if 'HarmonyLib' not in loader or 'VillagerInventoryNamePatch.Install' not in loader:
              raise SystemExit('Dynamic Harmony installation is missing')
          if 'VillagerBedRoamingPatch.Install' in loader or 'TickPatrol' in loader or 'GetWorkCenterCell' in loader:
              raise SystemExit('A second movement controller could override wooden-sign work/home routing')
          if 'LivingTowns sign/work/home/door/bed navigation is left untouched' not in loader:
              raise SystemExit('The native LivingTowns movement ownership guard is missing')
          if 'LivingTownsTradeWidget' not in ui_patch or 'OpCodes.Ldarg_2' not in ui_patch or 'Takas Stoğu' not in ui_patch:
              raise SystemExit('Direct trade-stock caption replacement is incomplete')
          if 'ResolveStockLabel' not in ui_patch or 'm_villagerName' not in bridge:
              raise SystemExit('Villager-name bridge is incomplete')
          if 'Köylü' not in bridge or 'return name' not in bridge:
              raise SystemExit('Villager name resolver is incomplete')
          if 'return m_name' not in identity:
              raise SystemExit('Identity name is not returned independently from the controller')
          if 'm_displayName' in identity or 'DisplayName' in identity:
              raise SystemExit('World creature display name must remain untouched')
          if 'InitializeCreatureTypes' in loader or 'SpawnLocationType.Surface' in loader:
              raise SystemExit('Random surface spawning remains enabled')
          dll = Path('KoylulerModu/bin/Release/net10.0/KoylulerModu.dll')
          if not dll.is_file():
              raise SystemExit(f'Missing compiled assembly: {dll}')
          print('PASS: 9 player templates + 9 door aliases; persistent names; individual eggs; inventory name; IsOptional values; wooden-sign work and sunset home routing remain under the unchanged LivingTowns controller; no second movement patch is installed.')
          print(f'Compiled assembly: {dll.stat().st_size} bytes')
          PY
      - name: Upload compiled mod files
        uses: actions/upload-artifact@v4
        with:
          name: KoylulerModu-build
          path: |
            KoylulerModu/bin/Release/net10.0/KoylulerModu.dll
            KoylulerModu/bin/Release/net10.0/modinfo.json
            KoylulerModu/bin/Release/net10.0/Assets/**
          if-no-files-found: error
          retention-days: 14
